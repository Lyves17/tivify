name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building TIVIFY v$VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             tivify-v${{ steps.version.outputs.version }}.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tivify-v${{ steps.version.outputs.version }}
          path: tivify-v${{ steps.version.outputs.version }}.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: TIVIFY v${{ steps.version.outputs.version }}
          body: |
            ## TIVIFY v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `tivify-v${{ steps.version.outputs.version }}.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK file to install

            ### Requirements
            - Android 8.0 (API 26) or higher
            - Works on phones, tablets, and Android TV

            ---
            *Built automatically via GitHub Actions*
            *This project is [vibecoded](https://github.com/topics/vibecoding) with Claude*
          files: tivify-v${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
