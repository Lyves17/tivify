name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan on Monday 04:17 UTC to pick up new rules.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality
          # Restrict analysis to the subtree that matches each language so the
          # Go autobuild finds the right go.mod and the Kotlin extractor finds
          # the Android module. Leaving it empty confuses autobuild on
          # monorepos.
          source-root: ${{ matrix.language == 'go' && 'backend' || (matrix.language == 'java-kotlin' && 'android' || '.') }}

      # ---- Go: autobuild handles `go build ./...` automatically ----
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      # ---- Android / Kotlin build ----
      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sync VERSION
        if: matrix.language == 'java-kotlin'
        run: cp VERSION android/VERSION

      - name: Build Android
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1
          ./gradlew --no-daemon assembleDebug

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
