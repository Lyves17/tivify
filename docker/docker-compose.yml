# SECURITY: Docker Secrets Management
# For production, replace environment variable secrets with Docker secrets:
# 1. Create secrets: docker secret create db_password -
# 2. Reference in compose: secrets: [db_password]
# 3. Access in container: cat /run/secrets/db_password
# This prevents secrets from being visible in container inspect or logs
# TODO: Migrate to Docker secrets for production deployments

services:
  postgres:
    image: postgres:16-alpine
    container_name: tivify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tivify}
      POSTGRES_USER: ${DB_USER:-tivify}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tivify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tivify-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.0.0"
    container_name: tivify-backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tivify}
      DB_USER: ${DB_USER:-tivify}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tivify.local}
      BASE_URL: ${BASE_URL:-http://localhost}
      MEDIA_PATH: /media
      FFMPEG_PATH: /usr/bin/ffmpeg
      LIBRARY_PATH: /library
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - media_data:/media
      - ${LIBRARY_PATH:-/mnt/usb}:/library:ro
      - /mnt:/host-mnt:ro
      - /media:/host-media:ro
      - /run/media:/host-run-media:ro
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: tivify-frontend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${BASE_URL:-http://localhost}/api
      NEXT_PUBLIC_STREAM_URL: ${BASE_URL:-http://localhost}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    container_name: tivify-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - apk_output:/output:ro
      - media_data:/media:ro
      - ${LIBRARY_PATH:-/mnt/usb}:/library:ro
      - /mnt:/host-mnt:ro
      - /media:/host-media:ro
      - /run/media:/host-run-media:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '256M'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  tailscale:
    build:
      context: ./tailscale
      dockerfile: Dockerfile
    container_name: tivify-tailscale
    restart: unless-stopped
    network_mode: "service:nginx"
    env_file:
      - path: ../.env
        required: false
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-tivify}
      TS_SERVE_MODE: ${TS_SERVE_MODE:-https}
    volumes:
      - tailscale_data:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      nginx:
        condition: service_healthy

  android-build:
    build:
      context: ../android
      dockerfile: Dockerfile
    container_name: tivify-android-build
    profiles:
      - build-apk
    volumes:
      - apk_output:/output
      - gradle_cache:/gradle-cache

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  tailscale_data:
    driver: local
  apk_output:
    driver: local
  gradle_cache:
    driver: local
