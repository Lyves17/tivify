worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Additional video MIME types not in default mime.types
    types {
        video/x-matroska  mkv;
        video/x-flv       flv;
        video/x-m4v       m4v;
        video/x-ms-wmv    wmv;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    server {
        listen 80;
        server_name _;

        # SECURITY: Set allowed origins - default to same origin for better security
        # In production, replace with specific domain(s) or use dynamic validation
        set $cors_origin "";
        if ($http_origin ~* ^(https?://localhost(:[0-9]+)?|https?://127\.0\.0\.1(:[0-9]+)?)$) {
            set $cors_origin $http_origin;
        }

        # --- Live HLS manifests (no cache - changes every ~6 seconds) ---
        location ~ ^/media/live/(.+\.m3u8)$ {
            alias /media/live/$1;
            # SECURITY: Only allow configured origins instead of wildcard
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Range";
                add_header Content-Length 0;
                return 204;
            }
        }

        # --- Media files (HLS segments, thumbnails, logos, uploads) ---
        location /media/ {
            alias /media/;
            # SECURITY: Only allow configured origins instead of wildcard
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=3600";

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Range";
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
                add_header Content-Length 0;
                return 204;
            }
        }

        # --- Library direct serve (MP4 h264+aac without transcoding) ---
        location /library/ {
            alias /library/;
            # SECURITY: Only allow configured origins instead of wildcard
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=3600";

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Credentials "true";
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Range";
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
                add_header Content-Length 0;
                return 204;
            }
        }

        # --- Health check ---
        location = /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
