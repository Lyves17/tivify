worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Additional video MIME types not in default mime.types
    types {
        video/x-matroska  mkv;
        video/x-flv       flv;
        video/x-m4v       m4v;
        video/x-ms-wmv    wmv;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Tamano maximo de subida (para VODs grandes)
    client_max_body_size 10G;

    # Buffer temporal para uploads grandes
    client_body_temp_path /tmp/nginx_uploads;
    client_body_buffer_size 256k;

    # m3u8 y ts ya incluidos en /etc/nginx/mime.types

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Client body timeout (default for most requests)
    client_body_timeout 300s;

    # Security
    server_tokens off;

    # Gzip
    gzip on;
    gzip_min_length 860;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/vnd.apple.mpegurl;

    # Logging with timing info
    log_format timed '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    # SECURITY: Structured JSON logging for better analysis and integration with ELK/syslog
    # TODO: Enable JSON logging format for production
    # Uncomment below and use with Elasticsearch, Logstash, Kibana stack or syslog integration
    # log_format json_combined escape=json
    #   '{'
    #     '"time_local":"$time_local",'
    #     '"remote_addr":"$remote_addr",'
    #     '"remote_user":"$remote_user",'
    #     '"request":"$request",'
    #     '"status": "$status",'
    #     '"body_bytes_sent":"$body_bytes_sent",'
    #     '"request_time":"$request_time",'
    #     '"http_referrer":"$http_referer",'
    #     '"http_user_agent":"$http_user_agent"'
    #   '}';

    access_log /var/log/nginx/access.log timed;
    error_log  /var/log/nginx/error.log;

    include /etc/nginx/conf.d/*.conf;
}
