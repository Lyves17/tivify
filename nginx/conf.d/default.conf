#    return 301 https://$host$request_uri;
#}

server {
    listen 80;
    server_name _;

    # CORS origin validation (same logic as former media-server)
    set $cors_origin "";
    if ($http_origin ~* ^(https?://localhost(:[0-9]+)?|https?://127\.0\.0\.1(:[0-9]+)?)$) {
        set $cors_origin $http_origin;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;

    # --- Auth rate limit (brute-force protection) ---
    location /api/v1/auth/login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API Upload endpoints (sin rate limit, timeouts extendidos) ---
    location ~ ^/api/v1/admin/media/upload {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts extendidos para archivos grandes (1 hora)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;

        # Streaming directo sin bufferizar en disco
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # --- WebSocket (real-time events) ---
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- API Backend ---
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts largos para requests normales
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;

        # No cache for API responses
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --- Xtream Codes Compatible ---
    location = /player_api.php {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /xmltv.php {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /get.php {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Xtream Codes stream routes (formato: /live|movie|series/user/pass/id) ---
    location ~ ^/live/[^/]+/[^/]+/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_body_timeout 86400s;
    }

    location ~ ^/movie/[^/]+/[^/]+/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location ~ ^/series/[^/]+/[^/]+/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # --- Internal auth request endpoint ---
    location = /auth/validate-stream-token {
        internal;
        proxy_pass http://backend/api/internal/validate-stream-token$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =====================================================
    # STATIC FILE SERVING (formerly media-server container)
    # =====================================================

    # --- Live HLS manifests (no cache - changes every ~6 seconds) ---
    location ~ ^/media/live/(.+\.m3u8)$ {
        auth_request /auth/validate-stream-token;
        alias /media/live/$1;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Range";
            add_header Content-Length 0;
            return 204;
        }
    }

    # --- HLS segments: short cache (10s) ---
    location ~ ^(/media/.*\.ts)$ {
        alias $1;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=10";
    }

    # --- Media files (thumbnails, logos, uploads, VOD segments) ---
    location /media/ {
        alias /media/;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600";

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
            add_header Content-Length 0;
            return 204;
        }
    }

    # --- Library direct serve (MP4 h264+aac without transcoding) ---
    location /library/ {
        auth_request /auth/validate-stream-token;
        alias /library/;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=3600";

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Range";
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges";
            add_header Content-Length 0;
            return 204;
        }
    }

    # --- APK download ---
    location = /tivify.apk {
        alias /output/tivify.apk;
        add_header Content-Disposition "attachment; filename=tivify.apk";
        add_header Content-Type application/vnd.android.package-archive;
    }

    # --- Health check ---
    location = /health {
        proxy_pass http://backend;
    }

    # Cache Next.js static assets (immutable hashed files)
    location /_next/static/ {
        proxy_pass http://frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Frontend (todo lo demas) ---
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (para HMR en desarrollo)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
