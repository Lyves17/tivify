services:
  postgres:
    image: postgres:16-alpine
    container_name: tivify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tivify}`
      POSTGRES_USER: ${DB_USER:-tivify}`
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}`
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tivify}`"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tivify-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}`
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}`", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: "1.0.0"
    container_name: tivify-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}`
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tivify}`
      DB_USER: ${DB_USER:-tivify}`
      DB_PASSWORD: ${DB_PASSWORD:-changeme}`
      DB_SSLMODE: ${DB_SSLMODE:-disable}`
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}`
      JWT_SECRET: ${JWT_SECRET:-}`
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}`
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}`
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tivify.local}`
      BASE_URL: ${BASE_URL:-http://localhost}`
      MEDIA_PATH: /media
      FFMPEG_PATH: /usr/bin/ffmpeg
      LIBRARY_PATH: /library
      TMDB_API_KEY: ${TMDB_API_KEY:-}`
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tivify-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${BASE_URL:-http://localhost}`/api
      NEXT_PUBLIC_STREAM_URL: ${BASE_URL:-http://localhost}`
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tivify-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '256M'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
